name: Release site

on:
  push:
    tags:
      # Version tags only. GitHub tag filters are globs, not regular expressions.
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build worker
        run: npm run build:worker

      - name: Package site zip
        run: npm run zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            returno-*.zip
            worker.mjs
          overwrite_files: true
          generate_release_notes: false
          body: |
            Cloudflare Worker build for https://returno.site.

            `worker.mjs` is the self-contained Worker script. Deploy it to the `returno` Worker by hand, and only when the owner asks. A merge or a tag does not deploy.

            `returno-<version>.zip` is the same prerendered site, with `index.html` at the top of the archive. It is kept so the files can be inspected or hosted elsewhere. Production responses come from the Worker: unknown paths return 404, and methods other than GET and HEAD return 405.

            Estimates only, not financial advice.
